name: mongo-sharding-repl

services:
  #  роутер
  mongos_router:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos_router
    restart: always
    ports: [ "27020:27020" ]
    command: [ "mongos","--configdb","config_server/configSrv:27021","--bind_ip_all","--port","27020" ]
    depends_on: [ configSrv,shard1,shard2 ]

  #  сервер конфигурации
  configSrv:
    image: dh-mirror.gitverse.ru/mongo:latest # docker образ
    container_name: configSrv
    ports: [ "27021:27021" ]
    volumes: [ config-data:/data/db ]
    command: [ "--configsvr","--replSet","config_server","--bind_ip_all","--port","27021" ]

  #  1-й шард
  shard1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1
    ports: [ "27022:27022" ]
    volumes: [ shard1-data:/data/db ]
    command: [ "--shardsvr","--replSet","shard1","--bind_ip_all","--port","27022" ]
    depends_on: [ shard1b,shard1c ]

  # реплика 1b
  shard1b:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1b
    ports: [ "27023:27023" ]
    volumes: [ shard1b-data:/data/db ]
    command: [ "--shardsvr","--replSet","shard1","--bind_ip_all","--port","27023" ]

  # реплика 1c
  shard1c:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1c
    ports: [ "27024:27024" ]
    volumes: [ shard1c-data:/data/db ]
    command: [ "--shardsvr","--replSet","shard1","--bind_ip_all","--port","27024" ]

  #  2-й шард
  shard2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2
    ports: [ "27025:27025" ]
    volumes: [ shard2-data:/data/db ]
    command: [ "--shardsvr","--replSet","shard2","--bind_ip_all","--port","27025" ]
    depends_on: [ shard2b,shard2c ]

  # реплика 2b
  shard2b:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2b
    ports: [ "27026:27026" ]
    volumes: [ shard2b-data:/data/db ]
    command: [ "--shardsvr","--replSet","shard2","--bind_ip_all","--port","27026" ]

  # реплика 2c
  shard2c:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2c
    ports: [ "27027:27027" ]
    volumes: [ shard2c-data:/data/db ]
    command: [ "--shardsvr","--replSet","shard2","--bind_ip_all","--port","27027" ]

  # Приложение
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on: [ mongos_router ]
    ports: [ 8080:8080 ]
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"


volumes:
  config-data:
  shard1-data:
  shard1b-data:
  shard1c-data:
  shard2-data:
  shard2b-data:
  shard2c-data:
